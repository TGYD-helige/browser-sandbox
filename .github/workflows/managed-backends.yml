name: Managed backends

on:
  pull_request:
    branches: [master]
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  docker:
    name: Docker (${{ matrix.runner }})
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: docker build -t browser-sandbox:managed .
      - run: docker build -f Dockerfile.e2e --build-arg BROWSER_IMAGE=browser-sandbox:managed -t browser-sandbox-managed-harness:local .
      - run: node .github/scripts/managed/docker.mjs
      - if: ${{ !cancelled() }}
        run: node .github/scripts/managed/recovery-docker.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: managed-docker-${{ matrix.runner }}
          path: managed-results/
          if-no-files-found: ignore

  kubernetes:
    name: Kubernetes (${{ matrix.runner }})
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: azure/setup-helm@v4
        with:
          version: v4.1.1
      - run: bash .github/scripts/managed/install-k3d.sh
      - run: echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - run: pnpm install --frozen-lockfile && pnpm build
      - run: python -m pip install -r .github/scripts/managed/requirements.txt
      - run: python .github/scripts/managed/test-chart.py && python .github/scripts/managed/test-k3d-cluster.py
      - run: docker build -t browser-sandbox:managed .
      - run: docker build -f .github/scripts/managed/Dockerfile.client -t browser-sandbox-client:managed .
      - run: bash .github/scripts/verify-image.sh browser-sandbox:managed
      - run: node .github/scripts/managed/kubernetes.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: managed-kubernetes-${{ matrix.runner }}
          path: managed-results/
          if-no-files-found: ignore
