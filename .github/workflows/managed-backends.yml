name: Managed backends

on:
  pull_request:
    branches: [master]
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  docker:
    name: Docker (${{ matrix.runner }})
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: docker build -t browser-sandbox:managed .
      - run: node .github/scripts/managed/docker.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: managed-docker-${{ matrix.runner }}
          path: managed-results/
          if-no-files-found: ignore
