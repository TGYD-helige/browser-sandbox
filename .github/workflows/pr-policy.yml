name: PR policy

on:
  pull_request_target:
    branches: [master]
    types: [opened, edited, synchronize, reopened, ready_for_review]

permissions:
  contents: read

jobs:
  title:
    name: PR title
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      # Execute only the trusted base-commit script; PR code is never loaded.
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          persist-credentials: false
          sparse-checkout: .github/scripts/validate-pr-title.sh
          sparse-checkout-cone-mode: false
      - name: Validate Conventional Commit title
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: bash .github/scripts/validate-pr-title.sh
