name: Browser integration

on:
  pull_request:
    branches: [master]
  push:
    branches: [master]
  workflow_dispatch:
    inputs:
      run_model:
        description: Run Pi, DSH, and OpenCode model-driven browser tests (requires OPENAI secrets)
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: browser-integration-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  image:
    name: Sandboxed image (${{ matrix.runner }})
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - run: docker build -t browser-sandbox:local .
      - run: bash .github/scripts/verify-image.sh browser-sandbox:local
        env:
          BENCHMARK_OUTPUT: benchmark-${{ matrix.runner }}.json
      - uses: actions/upload-artifact@v4
        with:
          name: browser-performance-${{ matrix.runner }}
          path: benchmark-${{ matrix.runner }}.json
          if-no-files-found: error

  harness:
    name: ${{ matrix.harness }} browser E2E
    strategy:
      fail-fast: false
      matrix:
        harness: [pi, dsh, opencode, agent-browser]
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: pnpm/action-setup@v4
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: docker build -t browser-sandbox:local .
      - run: docker build -f Dockerfile.e2e -t browser-sandbox-e2e:local .
      - run: node .github/scripts/e2e.mjs ${{ matrix.harness }}

      - name: Model-driven browser handoff
        if: matrix.harness != 'agent-browser' && (github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.run_model) || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository))
        env:
          E2E_MODE: model
          OPENAI_BASE_URL: ${{ vars.OPENAI_BASE_URL || secrets.OPENAI_BASE_URL }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_MODEL_NAME: ${{ vars.OPENAI_MODEL_NAME || secrets.OPENAI_MODEL_NAME }}
        run: node .github/scripts/e2e.mjs ${{ matrix.harness }}
