name: Image relay capability probe
on:
  workflow_dispatch:
    inputs:
      image_tag:
        type: string
      publish_latest:
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  artifact:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Create a synthetic ARM64 image without executing it
        run: |
          head -c 16777216 /dev/urandom > payload
          printf 'FROM scratch\nCOPY payload /payload\n' > Dockerfile
          docker build --platform linux/arm64 -t relay-probe:arm64 .
          docker save --output image.tar relay-probe:arm64
          sha256sum image.tar > image.tar.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: relay-probe
          path: |
            image.tar
            image.tar.sha256
          compression-level: 0
          retention-days: 1
  relay:
    needs: artifact
    runs-on: arc-simple
    timeout-minutes: 5
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: relay-probe
      - name: Verify and copy the foreign-architecture archive
        run: |
          set -euo pipefail
          sha256sum --check image.tar.sha256
          skopeo --version
          crane version
          skopeo inspect --config docker-archive:image.tar | jq -e '.architecture == "arm64" and .os == "linux"'
          skopeo copy docker-archive:image.tar dir:relay-probe
