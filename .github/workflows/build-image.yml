name: Publish verified browser image aliases

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: browser-image-build
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ${{ vars.BROWSER_IMAGE_PUBLISH_RUNNER || 'arc-simple' }}
    timeout-minutes: 20
    env:
      DOCKER_CONFIG: ${{ runner.temp }}/browser-image-auth
      REGISTRY: ${{ vars.BAIDU_CCR_REGISTRY }}
      NAMESPACE: ${{ vars.BAIDU_CCR_NAMESPACE }}
      VERIFIED_DIGEST: sha256:de2f7cf91e6eb5b9d791157ec9b7c6e6c50dfbc7e07318159e55f77950ab2d4e
    steps:
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ vars.BAIDU_CCR_USERNAME }}
          password: ${{ secrets.BAIDU_CCR_PASSWORD }}
      - name: Copy verified version and publish generic latest
        shell: bash
        run: |
          set -euo pipefail
          base="$REGISTRY/$NAMESPACE"
          source="$base/mirrorx-browser-use-runtime"
          target="$base/browser-sandbox"
          [[ "$(crane digest "$source:v0.1.2")" == "$VERIFIED_DIGEST" ]]
          crane manifest "$source@$VERIFIED_DIGEST" | jq -e '[.manifests[].platform | .os + "/" + .architecture] | sort == ["linux/amd64", "linux/arm64"]'
          old_latest=()
          for name in mirrorx-browser-use-runtime chrome-sidecar; do
            [[ "$(crane digest "$base/$name:v0.1.2")" == "$VERIFIED_DIGEST" ]]
            tags="$(crane ls "$base/$name")"
            case $'\n'"$tags"$'\n' in
              *$'\nlatest\n'*) old_latest+=("$(crane digest "$base/$name:latest")") ;;
              *) old_latest+=(absent) ;;
            esac
          done
          crane copy "$source@$VERIFIED_DIGEST" "$target:v0.1.2"
          [[ "$(crane digest "$target:v0.1.2")" == "$VERIFIED_DIGEST" ]]
          crane tag "$target@$VERIFIED_DIGEST" latest
          [[ "$(crane digest "$target:latest")" == "$VERIFIED_DIGEST" ]]
          index=0
          for name in mirrorx-browser-use-runtime chrome-sidecar; do
            [[ "$(crane digest "$base/$name:v0.1.2")" == "$VERIFIED_DIGEST" ]]
            tags="$(crane ls "$base/$name")"
            case $'\n'"$tags"$'\n' in
              *$'\nlatest\n'*) current="$(crane digest "$base/$name:latest")" ;;
              *) current=absent ;;
            esac
            [[ "$current" == "${old_latest[$index]}" ]]
            index=$((index + 1))
            printf 'Verified unchanged: %s (v0.1.2 and latest).\n' "$base/$name" >> "$GITHUB_STEP_SUMMARY"
          done
          printf 'Published %s:v0.1.2 and %s:latest at %s (Linux AMD64/ARM64).\n' "$target" "$target" "$VERIFIED_DIGEST" >> "$GITHUB_STEP_SUMMARY"
          echo "Verified generic version and latest; both legacy image names are unchanged."
