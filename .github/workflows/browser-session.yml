name: Pi browser-session E2E

on:
  workflow_dispatch:
    inputs:
      run_model:
        description: Also run the real model-driven Pi session handoff (requires OPENAI secrets)
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: pi-browser-session-${{ github.ref }}
  cancel-in-progress: true

jobs:
  session:
    name: Pi agent browser_session tools
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Build browser runtime and harness images
        run: |
          docker build -t browser-sandbox:local .
          docker build -f Dockerfile.e2e -t browser-sandbox-e2e:local .
      - name: Pi scripted agent session handoff
        run: node .github/scripts/e2e.mjs pi
      - name: Pi model-driven agent session handoff
        if: inputs.run_model
        env:
          E2E_MODE: model
          OPENAI_BASE_URL: ${{ vars.OPENAI_BASE_URL || secrets.OPENAI_BASE_URL }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_MODEL_NAME: ${{ vars.OPENAI_MODEL_NAME || secrets.OPENAI_MODEL_NAME }}
        run: node .github/scripts/e2e.mjs pi
