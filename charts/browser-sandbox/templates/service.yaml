apiVersion: v1
kind: Service
metadata:
  name: {{ include "browser-sandbox.name" . }}
spec:
  type: {{ .Values.service.type }}
  selector:
    {{- include "browser-sandbox.labels" . | nindent 4 }}
    app.kubernetes.io/component: controller
  ports:
    - name: access
      port: {{ .Values.service.port }}
      targetPort: access
{{- if .Values.ingress.enabled }}
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "browser-sandbox.name" . }}
spec:
  {{- with .Values.ingress.className }}
  ingressClassName: {{ . | quote }}
  {{- end }}
  tls: {{ .Values.ingress.tls | toJson }}
  rules:
    - host: {{ required "ingress.host is required" .Values.ingress.host | quote }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ include "browser-sandbox.name" . }}
                port:
                  name: access
{{- end }}

---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "browser-sandbox.name" . }}-host
spec:
  type: ClusterIP
  selector:
    {{- include "browser-sandbox.labels" . | nindent 4 }}
    app.kubernetes.io/component: controller
  ports:
    - name: host-control
      port: {{ .Values.hostControl.port }}
      targetPort: host-control
