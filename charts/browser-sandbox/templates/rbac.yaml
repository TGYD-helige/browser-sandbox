apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "browser-sandbox.name" . }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "browser-sandbox.name" . }}
rules:
  - apiGroups: [""]
    resources: [pods]
    verbs: [create, get, list, delete{{ if or (gt (int .Values.controller.replicas) 1) .Values.controller.sharedState }}, patch{{ end }}]
  - apiGroups: [""]
    resources: [configmaps]
    resourceNames: [{{ include "browser-sandbox.name" . }}-workers]
    verbs: [get]

  {{- if or (gt (int .Values.controller.replicas) 1) .Values.controller.sharedState }}
  - apiGroups: [coordination.k8s.io]
    resources: [leases]
    verbs: [get, list, watch, create, update, delete]
  - apiGroups: [""]
    resources: [secrets]
    verbs: [get, create, update, delete]
  {{- end }}

---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "browser-sandbox.name" . }}
subjects:
  - kind: ServiceAccount
    name: {{ include "browser-sandbox.name" . }}
    namespace: {{ .Release.Namespace }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "browser-sandbox.name" . }}

---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "browser-sandbox.name" . }}-drain
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "browser-sandbox.name" . }}-drain
rules:
  - apiGroups: [""]
    resources: [pods]
    verbs: [get, list, delete]
  - apiGroups: [""]
    resources: [configmaps]
    resourceNames: [{{ include "browser-sandbox.name" . }}-workers]
    verbs: [get]
  {{- if or (gt (int .Values.controller.replicas) 1) .Values.controller.sharedState }}
  - apiGroups: [coordination.k8s.io]
    resources: [leases]
    verbs: [get]
  {{- end }}
  - apiGroups: [apps]
    resources: [deployments/scale]
    resourceNames: [{{ include "browser-sandbox.name" . }}]
    verbs: [get, patch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "browser-sandbox.name" . }}-drain
subjects:
  - kind: ServiceAccount
    name: {{ include "browser-sandbox.name" . }}-drain
    namespace: {{ .Release.Namespace }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "browser-sandbox.name" . }}-drain
