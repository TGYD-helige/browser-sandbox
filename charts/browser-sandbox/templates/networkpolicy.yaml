{{- $storageDomains := .Values.networkPolicy.storageEgressDomains }}
{{- range $storageDomains }}
  {{- if or (hasKey . "address") (not (kindIs "string" .hostname)) }}
    {{- fail "networkPolicy.storageEgressDomains entries must specify a hostname and port" }}
  {{- end }}
  {{- if or (gt (len .hostname) 253) (not (regexMatch `^([a-z0-9]([a-z0-9-]{0,61}[a-z0-9])?\.)+[a-z]([a-z0-9-]{0,61}[a-z0-9])?$` .hostname)) }}
    {{- fail "networkPolicy.storageEgressDomains hostname must be an exact fully qualified DNS name" }}
  {{- end }}
  {{- if or (hasSuffix ".cluster.local" .hostname) (regexMatch `(^|\.)[^.]+\.[^.]+\.(svc|pod)(\.|$)` .hostname) }}
    {{- fail "networkPolicy.storageEgressDomains only supports external storage hostnames, use a cluster policy for Kubernetes Services and Pods" }}
  {{- end }}
  {{- if or (not (regexMatch "^[0-9]{1,5}$" (toJson .port))) (lt (int .port) 1) (gt (int .port) 65535) }}
    {{- fail "networkPolicy.storageEgressDomains port must be an integer between 1 and 65535" }}
  {{- end }}
{{- end }}
{{- if not .Values.networkPolicy.apiServerCidrs }}
{{- fail "networkPolicy.apiServerCidrs must list every Kubernetes API endpoint CIDR" }}
{{- end }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "browser-sandbox.name" . }}-workers
spec:
  podSelector:
    matchLabels:
      {{- include "browser-sandbox.labels" . | nindent 6 }}
      app.kubernetes.io/component: worker
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              {{- include "browser-sandbox.labels" . | nindent 14 }}
              app.kubernetes.io/component: controller
  egress:
    # Public IPv4 only. Private, link-local, cluster and API destinations are excluded.
    - to:
        - ipBlock:
            cidr: 0.0.0.0/0
            except:
              {{- $reserved := list "0.0.0.0/8" "10.0.0.0/8" "100.64.0.0/10" "127.0.0.0/8" "169.254.0.0/16" "172.16.0.0/12" "192.0.0.0/24" "192.0.2.0/24" "192.168.0.0/16" "198.18.0.0/15" "198.51.100.0/24" "203.0.113.0/24" "224.0.0.0/4" "240.0.0.0/4" }}
              {{- concat $reserved .Values.networkPolicy.deniedCidrs .Values.networkPolicy.apiServerCidrs | uniq | toYaml | nindent 14 }}
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ .Values.networkPolicy.dnsNamespace | quote }}
          podSelector:
            matchLabels: {{ .Values.networkPolicy.dnsLabels | toJson }}
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    {{- if .Values.profileStore.enabled }}
    - to:
        - podSelector:
            matchLabels:
              {{- include "browser-sandbox.labels" . | nindent 14 }}
              app.kubernetes.io/component: controller
      ports:
        - protocol: TCP
          port: 8083
    {{- end }}
    {{- range .Values.networkPolicy.storageEgress }}
    - to:
        - ipBlock:
            cidr: {{ printf "%s/%s" .address (ternary "128" "32" (contains ":" .address)) | quote }}
      ports:
        - protocol: TCP
          port: {{ .port }}
    {{- end }}

---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "browser-sandbox.name" . }}-controller
spec:
  podSelector:
    matchLabels:
      {{- include "browser-sandbox.labels" . | nindent 6 }}
      app.kubernetes.io/component: controller
  policyTypes: [Ingress]
  ingress:
    - ports:
        - protocol: TCP
          port: {{ .Values.service.port }}
    {{- if .Values.hostControl.allowedPeers }}
    - from: {{ .Values.hostControl.allowedPeers | toJson }}
      ports:
        - protocol: TCP
          port: {{ .Values.hostControl.port }}
    {{- end }}

    {{- if or (gt (int .Values.controller.replicas) 1) .Values.controller.sharedState }}
    - from:
        - podSelector:
            matchLabels:
              {{- include "browser-sandbox.labels" . | nindent 14 }}
              app.kubernetes.io/component: controller
      ports:
        - protocol: TCP
          port: 8084
    {{- end }}

{{- if $storageDomains }}
---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: {{ include "browser-sandbox.name" . }}-storage-dns
spec:
  endpointSelector:
    matchLabels:
      {{- include "browser-sandbox.labels" . | nindent 6 }}
      app.kubernetes.io/component: worker
  egress:
    - toEndpoints:
        - matchLabels:
            "k8s:io.kubernetes.pod.namespace": {{ .Values.networkPolicy.dnsNamespace | quote }}
            {{- range $key, $value := .Values.networkPolicy.dnsLabels }}
            {{ printf "k8s:%s" $key | quote }}: {{ $value | quote }}
            {{- end }}
      toPorts:
        - ports:
            - port: "53"
              protocol: ANY
          rules:
            dns:
              - matchPattern: "*"
    {{- range $storageDomains }}
    - toFQDNs:
        - matchName: {{ .hostname | quote }}
      toPorts:
        - ports:
            - port: {{ .port | quote }}
              protocol: TCP
    {{- end }}
{{- end }}
